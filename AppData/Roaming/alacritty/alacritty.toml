[window]
startup_mode = "Maximized"
dynamic_title = true
title = "Alacritty"
resize_increments = false

[window.padding]
x = 10
y = 10

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[font]
size = 12.0
builtin_box_drawing = false

[font.normal]
family = "DejaVuSansM Nerd Font Mono"
style = "Regular"

[cursor]
unfocused_hollow = true

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
[terminal.shell]
program = "pwsh"
args = ["-NoExit", "-Command", "cd ~; . 'C:/Users/r.moshrefi/Documents/WindowsPowerShell/Microsoft.Powershell_profile.ps1'"]

